name: steward-sprint0-lab

services:
  fw-lab-01:
    build:
      context: ./sshd
    container_name: fw-lab-01
    init: true
    networks:
      lab-net:
        ipv4_address: 172.28.200.10
    healthcheck:
      test: ["CMD-SHELL", "pgrep -x sshd >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  openbao:
    image: openbao/openbao:latest
    container_name: bao-s1-lab
    environment:
      - BAO_DEV_ROOT_TOKEN_ID=dev-root-token
      - BAO_DEV_LISTEN_ADDRESS=0.0.0.0:8200
    command: ["server", "-dev"]
    networks:
      lab-net: {}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8200/v1/sys/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  steward:
    build:
      context: ..
      dockerfile: lab/steward-tools.Dockerfile
    container_name: steward-sprint0-web
    depends_on:
      fw-lab-01:
        condition: service_healthy
      openbao:
        condition: service_healthy
    environment:
      - OPENBAO_ADDR=http://openbao:8200
      - OPENBAO_TOKEN=dev-root-token
      - OPENBAO_BACKUP_DIR=/app/.steward/openbao
    init: true
    ports:
      - "3022:3000"
    volumes:
      - steward_state:/app/.steward
      - ./evidence:/app/evidence
      - ./probe.mjs:/app/lab/probe.mjs:ro
    networks:
      lab-net: {}
    cap_drop:
      - NET_ADMIN
      - NET_RAW
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s

networks:
  lab-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.200.0/24

volumes:
  steward_state: